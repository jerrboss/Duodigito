name: Build Duodigito APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project archive
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' ! -iname '*Builder*' | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found. Upload Duodigito-Android-Studio.zip"
            exit 1
          fi
          mkdir project
          unzip -o "$ARCHIVE" -d project

      - name: Force Java 17 Compatibility in Configurations
        run: |
          find project -name "build.gradle*" | while read -r file; do
            echo "Injecting Java 17 compatibility flags into $file"
            sed -i 's/Version.VERSION_1_8/Version.VERSION_17/g' "$file"
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$file"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$file"
            sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$file"
            sed -i 's/targetCompatibility = 1.8/targetCompatibility = 17/g' "$file"
            sed -i 's/sourceCompatibility = 1.8/sourceCompatibility = 17/g' "$file"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          SETTINGS=$(find project -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found in archive"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Duodigito-debug-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
