name: Build Duodigito APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project archive
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' ! -iname '*Builder*' | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found. Upload Duodigito-Android-Studio.zip"
            exit 1
          fi
          mkdir project
          unzip -o "$ARCHIVE" -d project
          find project -name settings.gradle.kts -print

      - name: Fix Java/Kotlin JVM Toolchain Target
        run: |
          # Находим все файлы build.gradle.kts в распакованном проекте
          find project -name "build.gradle.kts" | while read -r file; do
            echo "Fixing JVM target in $file"
            # Принудительно меняем старую JavaVersion.VERSION_1_8 или 1.8 на 17
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$file"
            sed -i 's/compatibility = 1.8/compatibility = 17/g' "$file"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$file"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          SETTINGS=$(find project -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found in archive"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          chmod +x gradlew || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Duodigito-debug-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
