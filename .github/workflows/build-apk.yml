name: Build Duodigito APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Target Project Archive
        run: |
          # Жестко проверяем наличие именно целевого архива, чтобы избежать путаницы с остальными zip-файлами
          if [ ! -f "Duodigito-Android-Studio (2).zip" ]; then
            echo "Error: Target archive 'Duodigito-Android-Studio (2).zip' not found in root!"
            exit 1
          fi
          
          mkdir -p project_source
          # Распаковываем без вывода лишнего мусора в лог
          unzip -q -o "Duodigito-Android-Studio (2).zip" -d project_source
          
          echo "Successfully extracted archive into project_source directory."

      - name: Hard-Fix Java 17 Compatibility
        run: |
          # Находим все конфигурационные файлы build.gradle и build.gradle.kts в распакованном коде
          find project_source -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | while read -r file; do
            echo "Applying Java 17 enforcement patches to: $file"
            # Корректно заменяем жестко зашитые версии 1.8 на 17
            sed -i 's/Version.VERSION_1_8/Version.VERSION_17/g' "$file"
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$file"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$file"
            sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$file"
            sed -i 's/targetCompatibility = 1.8/targetCompatibility = 17/g' "$file"
            sed -i 's/sourceCompatibility = 1.8/sourceCompatibility = 17/g' "$file"
          done

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Application APK
        run: |
          # Находим файл настроек Gradle, чтобы точно определить корень проекта внутри распакованных папок
          SETTINGS_PATH=$(find project_source -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "Error: Could not locate settings.gradle(.kts) inside the extracted project structure!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          echo "Navigating to project root: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Очищаем кэш и запускаем полную отладочную сборку приложения
          gradle clean assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duodigito-debug-APK
          path: project_source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
