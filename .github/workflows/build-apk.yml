name: Build Duodigito APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project archive
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' ! -iname '*Builder*' | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found. Upload Duodigito-Android-Studio.zip"
            exit 1
          fi
          mkdir project
          unzip -o "$ARCHIVE" -d project

      - name: Force Java 17 via Settings Injection
        run: |
          SETTINGS=$(find project -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          
          # Инжектируем глобальное правило совместимости с Java 17 для всех подпроектов
          cat << 'EOF' >> "$SETTINGS"

          gradle.lifecycle.beforeProject {
              plugins.withType(com.android.build.gradle.BasePlugin::class.java) {
                  extensions.configure(com.android.build.gradle.BaseExtension::class.java) {
                      compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile::class.java).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          EOF
          
          echo "Successfully injected Java 17 configuration into $SETTINGS"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          SETTINGS=$(find project -name settings.gradle.kts | head -1)
          cd "$(dirname "$SETTINGS")"
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Duodigito-debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
