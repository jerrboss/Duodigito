name: Build Duodigito APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project archive
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' ! -iname '*Builder*' | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found. Upload Duodigito-Android-Studio.zip"
            exit 1
          fi
          mkdir project
          unzip -o "$ARCHIVE" -d project

      - name: Force Java 17 via Safe Settings Injection
        run: |
          SETTINGS=$(find project -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          
          # Инжектируем чистый код без внешних зависимостей
          cat << 'EOF' >> "$SETTINGS"

          gradle.lifecycle.beforeProject {
              // Форсируем Java 17 для Android плагина через рефлексию
              plugins.initOrderWithId {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      val compileOptions = ext.javaClass.getMethod("getCompileOptions").invoke(ext)
                      val javaVersionEnum = Class.forName("org.gradle.api.JavaVersion")
                      val v17 = javaVersionEnum.getField("VERSION_17").get(null)
                      compileOptions.javaClass.getMethod("setSourceCompatibility", javaVersionEnum).invoke(compileOptions, v17)
                      compileOptions.javaClass.getMethod("setTargetCompatibility", javaVersionEnum).invoke(compileOptions, v17)
                  }
              }
              // Форсируем jvmTarget = 17 для всех задач компиляции Kotlin
              tasks.configureEach {
                  if (javaClass.name.startsWith("org.jetbrains.kotlin.gradle.tasks.KotlinCompile")) {
                      try {
                          val kOptions = javaClass.getMethod("getKotlinOptions").invoke(this)
                          kOptions.javaClass.getMethod("setJvmTarget", String::class.java).invoke(kOptions, "17")
                      } catch (e: Exception) {}
                  }
              }
          }
          EOF
          
          echo "Successfully injected reflection-safe Java 17 configuration"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          SETTINGS=$(find project -name settings.gradle.kts | head -1)
          cd "$(dirname "$SETTINGS")"
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Duodigito-debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
