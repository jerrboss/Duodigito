name: Build Duodigito APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project archive
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' ! -iname '*Builder*' | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found. Upload Duodigito-Android-Studio.zip"
            exit 1
          fi
          mkdir project
          unzip -o "$ARCHIVE" -d project
          find project -name settings.gradle.kts -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          SETTINGS=$(find project -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found in archive"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          
          # Жестко заставляем Gradle собирать Java и Kotlin под одну версию 17
          gradle assembleDebug \
            -Pandroid.defaults.buildfeatures.buildconfig=true \
            -Dorg.gradle.jvmargs="-Xmx2048m" \
            -Pkotlin.compiler.jvmTarget=17 \
            -Dorg.gradle.project.android.compileOptions.sourceCompatibility=VERSION_17 \
            -Dorg.gradle.project.android.compileOptions.targetCompatibility=VERSION_17

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Duodigito-debug-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
